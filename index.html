<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goods Sort Clone — Hard</title>
<style>
  *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,sans-serif;background:#1b1f24;color:#e8eaed;margin:0;padding:8px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  .hud{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:14px;margin-bottom:6px}
  .hud span{background:#2a2f36;padding:4px 10px;border-radius:20px}
  #msg{height:22px;color:#7ee787;font-weight:600;font-size:15px;margin-bottom:4px}
  /* Shelf */
  #shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:420px;background:#2a2f36;padding:8px;border-radius:12px;margin-bottom:10px}
  .slot{aspect-ratio:1;background:#1b1f24;border:2px dashed #3a4048;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,30px);position:relative;cursor:pointer;transition:.12s}
  .slot.filled{border-style:solid;border-color:#3a4048;background:#232830}
  .slot.locked{background:#15181c;border-color:#4a1f1f;color:#666}
  .slot.locked::after{content:"🔒";font-size:14px;position:absolute}
  .slot.frozen{background:linear-gradient(135deg,#1b1f24 50%,#2a3a4a 50%);border-color:#3a6a8a}
  .slot.selected{border-color:#4dabf7;box-shadow:0 0 0 2px #4dabf7 inset}
  .slot .badge{position:absolute;bottom:2px;right:3px;font-size:10px;color:#ffb86b}
  /* Order tray */
  #tray{display:flex;gap:6px;width:100%;max-width:420px;background:#2a2f36;padding:8px;border-radius:12px;margin-bottom:10px;overflow-x:auto}
  .tray-item{min-width:44px;height:44px;background:#232830;border:2px solid #3a4048;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;flex-shrink:0}
  .tray-item.sel{border-color:#4dabf7}
  .tray-item.hidden{opacity:.4}
  /* Buttons */
  .btns{display:flex;gap:8px;margin-top:6px}
  button{background:#4dabf7;color:#0b0e11;border:none;padding:8px 16px;border-radius:20px;font-weight:600;font-size:14px}
  button:active{transform:scale(.96)}
  button.ghost{background:#2a2f36;color:#e8eaed}
</style>
</head>
<body>
  <div class="hud">
    <span id="lvl">Lv 1</span>
    <span id="moves">Moves: 0</span>
    <span id="time">⏱ 90</span>
  </div>
  <div id="msg"></div>

  <div id="shelf"></div>
  <div id="tray"></div>

  <div class="btns">
    <button class="ghost" onclick="location.reload()">Restart</button>
    <button onclick="nextLevel()" id="nextBtn" style="display:none">Next</button>
  </div>

<script>
/* ============================================================
   GOODS SORT CLONE — HARD MODE
   Mechanics:
   - Shelf grid with some slots LOCKED (unlock by matching) or FROZEN (unlock after N matches)
   - Tray holds upcoming items; tap tray item then tap empty shelf slot to move
   - 3 identical items on shelf => auto-clear
   - Each level: layout, timer, move limit
   - "Layers": an item can sit ON TOP of another — hidden until uncovered
   ============================================================ */

const ITEMS = ['🍎','🍋','🍇','🥝','🍑','🍒','🥑','🍆'];

// Level definitions. Each shelf slot is:
// {item:'🍎'}  -> normal item
// {item:'🍎', under:'🍇'} -> stacked: shows apple on top, grape underneath
// null -> empty
// {locked:true} -> locked slot (cannot be used until unlocked by a match)
// {frozen:true} -> frozen slot, requires 2 matches to thaw
const LEVELS = [
  { // Level 1 — gentle intro with one locked slot
    name:'Lv 1',
    time:120,
    maxMoves:40,
    shelf:[
      {item:'🍎'},{item:'🍎'},{item:'🍋'},null,{locked:true},
      {item:'🍋'},{item:'🍇'},null,null,{item:'🍇'},
      {item:'🥝'},null,null,{item:'🥝'},null,
    ],
    tray:['🍎','🍋','🍇','🥝'],
    goal:'Match everything',
  },
  { // Level 2 — stacked items + one frozen slot
    name:'Lv 2',
    time:100,
    maxMoves:36,
    shelf:[
      {item:'🍑',under:'🍒'},{item:'🍑'},{item:'🍒'},{frozen:true},null,
      {item:'🥑',under:'🍑'},{item:'🥑'},{item:'🍒',under:'🥑'},null,null,
      {item:'🍒'},null,null,{item:'🥑'},null,
    ],
    tray:['🍑','🍒','🥑'],
    goal:'Uncover the stack!',
  },
  { // Level 3 — heavy: multiple locks + frozen + stacks + tight moves
    name:'Lv 3 HARD',
    time:90,
    maxMoves:30,
    shelf:[
      {item:'🍆',under:'🥝'},{item:'🍆'},{locked:true},{item:'🥝'},{frozen:true},
      {item:'🍆',under:'🍋'},{item:'🍋'},{item:'🥝',under:'🍋'},{locked:true},null,
      {item:'🍋'},{locked:true},null,{item:'🥝'},null,
      {locked:true},null,null,null,null,
    ],
    tray:['🍆','🍋','🥝'],
    goal:'Survive the locks!',
  },
];

let levelIndex = 0;
let state = null;
let selTray = -1;     // index in tray selected
let selShelf = -1;    // index in shelf selected (for moving between shelves)
let matches = 0;
let moves = 0;
let timeLeft = 0;
let timer = null;
let busy = false;

const shelfEl = document.getElementById('shelf');
const trayEl  = document.getElementById('tray');
const msgEl   = document.getElementById('msg');
const lvlEl   = document.getElementById('lvl');
const movesEl = document.getElementById('moves');
const timeEl  = document.getElementById('time');
const nextBtn = document.getElementById('nextBtn');

/* ---------- Setup ---------- */
function loadLevel(i){
  clearInterval(timer);
  busy = false;
  const cfg = LEVELS[i];
  // Deep copy shelf
  state = {
    shelf: cfg.shelf.map(s => s ? {...s} : null),
    tray: cfg.tray.slice(),
    cfg,
  };
  matches = 0; moves = 0; selTray = -1; selShelf = -1;
  timeLeft = cfg.time;
  lvlEl.textContent = cfg.name;
  msgEl.textContent = cfg.goal;
  nextBtn.style.display = 'none';
  render();
  startTimer();
}

function startTimer(){
  clearInterval(timer);
  timeEl.textContent = '⏱ ' + timeLeft;
  timer = setInterval(()=>{
    timeLeft--;
    timeEl.textContent = '⏱ ' + timeLeft;
    if(timeLeft <= 0){
      clearInterval(timer);
      msgEl.textContent = '⏰ Time up!';
      msgEl.style.color = '#ff6b6b';
      busy = true;
    }
  },1000);
}

/* ---------- Render ---------- */
function render(){
  // Shelf
  shelfEl.innerHTML = '';
  state.shelf.forEach((slot, idx) => {
    const d = document.createElement('div');
    d.className = 'slot';
    if(!slot){
      d.classList.add('empty');
    } else if(slot.locked){
      d.classList.add('locked');
    } else if(slot.frozen){
      d.classList.add('frozen');
    } else if(slot.item){
      d.classList.add('filled');
      d.textContent = slot.item;
      if(slot.under){
        const b = document.createElement('div');
        b.className = 'badge';
        b.textContent = '+' + slot.under;
        d.appendChild(b);
      }
    }
    if(idx === selShelf) d.classList.add('selected');
    d.onclick = () => onShelfClick(idx);
    shelfEl.appendChild(d);
  });

  // Tray
  trayEl.innerHTML = '';
  state.tray.forEach((item, idx) => {
    const d = document.createElement('div');
    d.className = 'tray-item' + (idx === selTray ? ' sel' : '');
    d.textContent = item || '·';
    d.onclick = () => onTrayClick(idx);
    trayEl.appendChild(d);
  });

  movesEl.textContent = 'Moves: ' + moves + '/' + state.cfg.maxMoves;
}

/* ---------- Interaction ---------- */
function onTrayClick(idx){
  if(busy) return;
  if(selShelf !== -1) { selShelf = -1; } // cancel shelf selection
  selTray = (selTray === idx) ? -1 : idx;
  render();
}

function onShelfClick(idx){
  if(busy) return;
  const slot = state.shelf[idx];

  // Case 1: nothing selected on shelf, no tray item selected -> select shelf item (to move within shelf)
  if(selTray === -1 && selShelf === -1){
    if(slot && slot.item && !slot.locked && !slot.frozen){
      selShelf = idx;
      render();
    }
    return;
  }

  // Case 2: a shelf item is selected, click another shelf slot to move it (if empty)
  if(selShelf !== -1){
    if(idx === selShelf){ selShelf = -1; render(); return; }
    if(!slot){ // empty slot
      const src = state.shelf[selShelf];
      // If source has 'under', it becomes the new top
      if(src.under){
        state.shelf[idx] = {item: src.under};
        state.shelf[selShelf] = src.item ? {item: src.item} : null;
        // Wait — proper: move top item, underneath stays. Simpler: move top only.
      } else {
        state.shelf[idx] = src;
        state.shelf[selShelf] = null;
      }
      moves++;
      selShelf = -1;
      afterAction();
      return;
    }
    // If clicking a filled slot with shelf selection, try to stack (put on top)
    if(slot && slot.item && !slot.locked && !slot.frozen && !slot.under){
      // Only allow if same? For simplicity allow stacking different (creates a stack)
      // But that could softlock. Let's only allow stacking identical to make matches harder/fairer
      const src = state.shelf[selShelf];
      if(src.item && src.item === slot.item){
        // combine into a stack: click target now has under = src.item
        state.shelf[idx] = {item: slot.item, under: src.item};
        state.shelf[selShelf] = null;
        moves++;
      }
      selShelf = -1;
      afterAction();
      return;
    }
    selShelf = -1; render(); return;
  }

  // Case 3: tray item selected, click empty shelf slot
  if(selTray !== -1){
    if(slot) return; // must be empty
    state.shelf[idx] = {item: state.tray[selTray]};
    state.tray[selTray] = null;
    selTray = -1;
    moves++;
    afterAction();
  }
}

/* ---------- Post-action checks ---------- */
function afterAction(){
  render();
  // Check matches
  const toClear = [];
  for(let i=0;i<state.shelf.length;i++){
    const s = state.shelf[i];
    if(!s || !s.item) continue;
    // count identical items currently visible
    let count = 0;
    for(let j=0;j<state.shelf.length;j++){
      const t = state.shelf[j];
      if(t && t.item === s.item) count++;
    }
    if(count >= 3) toClear.push(s.item);
  }
  const uniq = [...new Set(toClear)];
  if(uniq.length){
    uniq.forEach(item=>{
      let removed = 0;
      for(let i=0;i<state.shelf.length;i++){
        const s = state.shelf[i];
        if(s && s.item === item && removed < 3){
          // If item has 'under', expose it instead of removing
          if(s.under){
            state.shelf[i] = {item: s.under};
          } else {
            state.shelf[i] = null;
          }
          removed++;
        }
      }
      matches++;
    });
    msgEl.textContent = '✨ Match!';
    msgEl.style.color = '#7ee787';
    // Unlock frozen slots after 2 matches, locked after 3
    if(matches >= 2){
      state.shelf = state.shelf.map(s => (s && s.frozen) ? null : s);
    }
    if(matches >= 3){
      state.shelf = state.shelf.map(s => (s && s.locked) ? null : s);
    }
    render();
  }

  // Win check
  const remaining = state.shelf.some(s => s && (s.item || s.locked || s.frozen)) || state.tray.some(t => t);
  if(!remaining){
    clearInterval(timer);
    msgEl.textContent = '🎉 Level Cleared!';
    msgEl.style.color = '#7ee787';
    busy = true;
    nextBtn.style.display = 'inline-block';
    return;
  }

  // Lose check
  if(moves >= state.cfg.maxMoves){
    clearInterval(timer);
    msgEl.textContent = '❌ Out of moves!';
    msgEl.style.color = '#ff6b6b';
    busy = true;
  }
}

function nextLevel(){
  levelIndex = (levelIndex + 1) % LEVELS.length;
  loadLevel(levelIndex);
}

/* ---------- Boot ---------- */
loadLevel(0);
</script>
</body>
</html>
