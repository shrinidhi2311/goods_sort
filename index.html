<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goods Sort - Shelf Match Puzzle</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #2c1e16, #4a3222);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.8rem; letter-spacing: 1px; color: #ffda79; }
    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 1.05rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 18px;
      border-radius: 20px;
    }
    .cabinet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      background: #6f472b;
      padding: 18px;
      border-radius: 14px;
      border: 6px solid #3d2414;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      max-width: 720px;
      width: 100%;
    }
    @media (max-width: 600px) {
      .cabinet { grid-template-columns: repeat(2, 1fr); }
    }
    .shelf {
      background: #3b2313;
      border-bottom: 8px solid #8c5a36;
      border-radius: 8px;
      padding: 10px 8px 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      min-height: 82px;
      box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.6);
    }
    .slot {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .slot:hover { background: rgba(255, 255, 255, 0.14); }
    .slot.selected {
      background: rgba(255, 218, 121, 0.35);
      outline: 2px solid #ffda79;
      transform: translateY(-4px) scale(1.06);
    }
    .slot.matched {
      animation: popOut 0.35s ease forwards;
    }
    @keyframes popOut {
      0% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #ffda79;
      color: #2c1e16;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #ffc845; }
    #message {
      margin-top: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #7bed9f;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🛒 Goods Sort</h1>
    <div class="stats">
      <span>Level: <strong id="level">1</strong></span>
      <span>Score: <strong id="score">0</strong></span>
      <span>Moves: <strong id="moves">0</strong></span>
    </div>
  </header>

  <div class="cabinet" id="cabinet"></div>

  <div id="message"></div>

  <div class="controls">
    <button onclick="shuffleBoard()">🔀 Shuffle</button>
    <button onclick="initLevel(level)">🔄 Restart Level</button>
  </div>

  <script>
    const ALL_GOODS = ['🥤', '🧃', '🥫', '🍪', '🍩', '🧁', '🍎', '🍌', '🍓', '🧸', '⚽', '🪴'];
    let level = 1;
    let score = 0;
    let moves = 0;
    let shelves = [];
    let selected = null; // { shelfIdx, slotIdx }
    let locked = false;

    const cabinetEl = document.getElementById('cabinet');
    const levelEl = document.getElementById('level');
    const scoreEl = document.getElementById('score');
    const movesEl = document.getElementById('moves');
    const msgEl = document.getElementById('message');

    function initLevel(lvl) {
      level = lvl;
      moves = 0;
      selected = null;
      locked = false;
      msgEl.textContent = '';
      updateHUD();

      const shelfCount = Math.min(6 + (lvl - 1), 9); // 6 to 9 shelves
      const itemTypesCount = Math.min(4 + (lvl - 1), ALL_GOODS.length);
      const chosenGoods = ALL_GOODS.slice(0, itemTypesCount);

      // Create sets of 3 for each chosen item, leaving enough empty slots to maneuver
      let pool = [];
      const maxTriples = Math.floor((shelfCount * 3 - 3) / 3);
      for (let i = 0; i < maxTriples; i++) {
        const item = chosenGoods[i % chosenGoods.length];
        pool.push(item, item, item);
      }

      while (pool.length < shelfCount * 3) {
        pool.push(null);
      }

      // Shuffle pool and ensure no shelf starts already matched
      do {
        pool.sort(() => Math.random() - 0.5);
        shelves = [];
        for (let i = 0; i < shelfCount; i++) {
          shelves.push(pool.slice(i * 3, i * 3 + 3));
        }
      } while (shelves.some(s => s[0] && s[0] === s[1] && s[1] === s[2]));

      render();
    }

    function render(matchedShelfIdx = -1) {
      cabinetEl.innerHTML = '';
      shelves.forEach((shelf, sIdx) => {
        const shelfDiv = document.createElement('div');
        shelfDiv.className = 'shelf';

        shelf.forEach((item, slotIdx) => {
          const slotDiv = document.createElement('div');
          slotDiv.className = 'slot';
          if (selected && selected.shelfIdx === sIdx && selected.slotIdx === slotIdx) {
            slotDiv.classList.add('selected');
          }
          if (sIdx === matchedShelfIdx && item !== null) {
            slotDiv.classList.add('matched');
          }
          slotDiv.textContent = item || '';
          slotDiv.onclick = () => handleSlotClick(sIdx, slotIdx);
          shelfDiv.appendChild(slotDiv);
        });

        cabinetEl.appendChild(shelfDiv);
      });
    }

    function handleSlotClick(sIdx, slotIdx) {
      if (locked) return;
      const clickedItem = shelves[sIdx][slotIdx];

      // Select an item
      if (!selected) {
        if (clickedItem !== null) {
          selected = { shelfIdx: sIdx, slotIdx: slotIdx };
          render();
        }
        return;
      }

      // Deselect if clicking the same slot
      if (selected.shelfIdx === sIdx && selected.slotIdx === slotIdx) {
        selected = null;
        render();
        return;
      }

      // Switch selection if clicking another occupied slot
      if (clickedItem !== null) {
        selected = { shelfIdx: sIdx, slotIdx: slotIdx };
        render();
        return;
      }

      // Move item into empty slot
      shelves[sIdx][slotIdx] = shelves[selected.shelfIdx][selected.slotIdx];
      shelves[selected.shelfIdx][selected.slotIdx] = null;
      selected = null;
      moves++;
      updateHUD();

      checkMatch(sIdx);
    }

    function checkMatch(sIdx) {
      const shelf = shelves[sIdx];
      if (shelf[0] && shelf[0] === shelf[1] && shelf[1] === shelf[2]) {
        locked = true;
        render(sIdx);
        setTimeout(() => {
          shelves[sIdx] = [null, null, null];
          score += 100;
          locked = false;
          updateHUD();
          render();
          checkWin();
        }, 350);
      } else {
        render();
      }
    }

    function checkWin() {
      const isEmpty = shelves.every(shelf => shelf.every(slot => slot === null));
      if (isEmpty) {
        msgEl.textContent = `🎉 Level ${level} Cleared! Loading next level...`;
        setTimeout(() => initLevel(level + 1), 1500);
      }
    }

    function shuffleBoard() {
      if (locked) return;
      selected = null;
      let flat = shelves.flat();
      flat.sort(() => Math.random() - 0.5);
      for (let i = 0; i < shelves.length; i++) {
        shelves[i] = flat.slice(i * 3, i * 3 + 3);
      }
      render();
    }

    function updateHUD() {
      levelEl.textContent = level;
      scoreEl.textContent = score;
      movesEl.textContent = moves;
    }

    initLevel(1);
  </script>
</body>
</html>
